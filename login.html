<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">SC_ / sign in</div>

    <div id="invalidMsg" class="alert-err mb-3" hidden>
      Incorrect email address or password.
    </div>
    <div id="emptyMsg" class="alert-err mb-3" hidden>
      Please fill in all fields.
    </div>
    <div id="formatMsg" class="alert-err mb-3" hidden>
      Enter a valid email address.
    </div>

    <form id="loginForm" action="login.php" method="POST" novalidate>
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Email</label>
        <input type="email" class="form-control" id="loginEmail" name="email" placeholder="bXXXXXXXXX@sakarya.edu.tr" autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" class="form-control" id="loginPassword" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-accent w-100">Sign in</button>
    </form>

    <p class="text-center mt-4 mono note">
      Credentials are configured by the site owner.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const MESSAGES_BY_ERROR = {
  empty: 'emptyMsg',
  invalid: 'invalidMsg'
};

const emailInput = document.getElementById('loginEmail');
const passwordInput = document.getElementById('loginPassword');
const errorFlags = Object.values(MESSAGES_BY_ERROR);

function hideMessages() {
  errorFlags.forEach(id => {
    const element = document.getElementById(id);
    if (element) element.hidden = true;
  });
  [emailInput, passwordInput].forEach(input => input.classList.remove('input-error'));
}

function flagError(id) {
  document.getElementById(id).hidden = false;
}

hideMessages();

const error = new URLSearchParams(window.location.search).get('error');
if (error && MESSAGES_BY_ERROR[error]) flagError(MESSAGES_BY_ERROR[error]);

document.getElementById('loginForm').addEventListener('submit', event => {
  hideMessages();

  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (!email || !password) {
    flagError('emptyMsg');
    if (!email) emailInput.classList.add('input-error');
    if (!password) passwordInput.classList.add('input-error');
    event.preventDefault();
    return;
  }

  if (!EMAIL_PATTERN.test(email)) {
    flagError('formatMsg');
    emailInput.classList.add('input-error');
    event.preventDefault();
  }
});
</script>
</body>
</html>
